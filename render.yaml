# Render Blueprint: deploys the app as one free web service.
# The Gemini key is NOT stored here. Render asks for it when you create the service.
services:
  - type: web
    name: invoice-checker-v2
    runtime: node
    plan: free
    branch: invoice-check
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: ABR_GUID
        sync: false
      - key: LARGE_PAYMENT_THRESHOLD
        value: "5000"
      - key: GEMINI_DAILY_LIMIT
        value: "500"
      - key: SCANS_PER_HOUR
        value: "30"
      # Optional: keep the database when Render restarts the app (https://upstash.com)
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Optional: forward invoices by email (Gmail app password + Brevo for replies)
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
