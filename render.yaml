# Render Blueprint: deploys the app as one free web service.
# The Gemini key is NOT stored here. Render asks for it when you create the service.
services:
  - type: web
    name: invoice-checker-v2
    runtime: node
    plan: free
    branch: invoice-check
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: ABR_GUID
        sync: false
      - key: LARGE_PAYMENT_THRESHOLD
        value: "5000"
